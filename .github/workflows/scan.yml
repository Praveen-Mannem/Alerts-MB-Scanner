name: Mother & Baby Scanner

on:
  schedule:
    # Hourly at :20 past, 04:20-10:20 UTC = 09:50-15:50 IST, Mon-Fri.
    # Only 1H/1D signals are scanned now, so hourly is frequent enough.
    - cron: "20 4-10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated state.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Persist signal state
        run: |
          git config user.name "mb-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update signal state [skip ci]"
          git pull --rebase origin main
          git push
